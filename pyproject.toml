[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-clustering"
version = "0.1.0"
description = "Customer clustering pipeline for e-commerce transaction data"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.14,<2",
    "pyarrow>=17,<22",
    "openpyxl>=3.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "shap>=0.46,<1",
    "streamlit>=1.39,<2",
    "plotly>=5.0",
    "tabulate>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
